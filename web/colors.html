<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Colours</title>
<link rel="stylesheet" href="app.css">
<style>
  body { overflow: auto; background: #e9e4d8; padding: 24px 16px 40px; color: #2a2620; }
  h1 { font-weight: 600; font-size: 24px; margin: 0 0 4px; }
  p.lead { color: #6f675b; margin: 0 0 18px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,.12); }
  .paper { padding: 14px; display: flex; justify-content: center; }
  .paper img { max-height: 130px; max-width: 100%; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  .row { display: grid; grid-template-columns: 1fr 1fr; }
  .panel { padding: 8px 10px; font-size: 13px; }
  .panel.l { background: #f8f4ea; color: #2a2620; }
  .panel.d { background: #23201b; color: #ece5d6; }
  .panel a { font-weight: 600; text-decoration: underline; }
  .panel .ico { width: 20px; height: 20px; vertical-align: -5px; }
  .t { font-size: 12px; padding: 6px 10px; background: #fff; color: #555; }
</style>
</head>
<body>
<h1>Print colours</h1>
<p class="lead">For each print: the measured paper colour behind it (the surround), and the accent on the light and the dark panel, after the contrast adjustment the app applies.</p>
<div class="grid" id="grid"></div>
<script type="module">
  import { ICON } from "./lib/icons.js";
  const hex = (h) => h && [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((x, i) => Math.round(x * (1 - t) + b[i] * t));
  const css = ([r, g, b]) => `rgb(${r} ${g} ${b})`;
  const L = (c) => { const [r, g, b] = c.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contrast = (a, b) => { const [hi, lo] = [L(a), L(b)].sort((x, y) => y - x); return (hi + 0.05) / (lo + 0.05); };
  const fix = (col, bg, target) => { for (let t = 0; t <= 1; t += 0.05) { const c = mix(col, target, t); if (contrast(c, bg) >= 4.5) return c; } return target; };
  const index = await (await fetch("data/index.json")).json();
  document.getElementById("grid").innerHTML = index.map((p) => {
    const c = p.colors || {};
    const paper = c.paper || "#e9e2d3";
    const al = css(fix(hex(c.accent_light), [248, 244, 234], [0, 0, 0]));
    const ad = css(fix(hex(c.accent_dark), [35, 32, 27], [255, 255, 255]));
    const img = p.local_image || p.image_url;
    return `<div class="card">
      <div class="paper surround-washi" style="--plain:${paper}"><img src="${img}" alt=""></div>
      <div class="row">
        <div class="panel l" style="color:${al}">${ICON.rain} <a>Link</a></div>
        <div class="panel d" style="color:${ad}">${ICON.rain} <a>Link</a></div>
      </div>
      <div class="t">${p.title.slice(0, 44)} · paper ${c.paper || "—"} · inks ${c.accent_light} / ${c.accent_dark}</div></div>`;
  }).join("");
</script>
</body>
</html>
