<style>
:root {

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1b18; --card: #26231f; --ink: #ece6da; --muted: #a39a8b; --line: #3a362f;
    --bar: #8fb0cc; --bar-bg: #34302a; --accent: #e07a62; --ok: #9cc58a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Source Serif 4", Georgia, serif; font-size: 15px; line-height: 1.4; }
header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
h1 { font-weight: 600; font-size: 26px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
select, button { font: inherit; padding: 4px 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); border-radius: 4px; cursor: pointer; }
main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  display: flex; flex-direction: column; }
.card.excluded { opacity: .6; }
.card.flagged { outline: 2px solid var(--accent); }
.imgwrap { position: relative; background: var(--bar-bg); }
.imgwrap img { display: block; width: 100%; height: auto; }
.crop { position: absolute; border: 2px dashed var(--accent); pointer-events: none; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.title { font-weight: 600; font-size: 16px; }
.meta { color: var(--muted); font-size: 13px; }
.meta a { color: inherit; }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 6px; font-size: 13px; align-items: start; }
.row > span:first-child { color: var(--muted); }
.vec { display: flex; flex-direction: column; gap: 2px; }
.bar { display: grid; grid-template-columns: 82px 1fr 30px; gap: 6px; align-items: center; }
.bar i { display: block; height: 7px; background: var(--bar-bg); border-radius: 4px; position: relative; }
.bar i b { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 4px; }
.null { color: var(--muted); font-style: italic; }
.pal { display: flex; gap: 4px; }
.pal span { width: 22px; height: 16px; border-radius: 3px; border: 1px solid var(--line); }
.evidence, .friction { font-size: 13px; }
.friction { color: var(--accent); }
.tag { display: inline-block; padding: 0 6px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; margin: 0 4px 2px 0; }
.review { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.review label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
textarea { font: inherit; font-size: 13px; width: 100%; min-height: 44px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); border-radius: 4px; padding: 4px 6px; }
#export-out { width: 100%; max-width: 1400px; margin: 0 auto 0; display: none; }
</style>
</head>

<header>

    <span id="count" class="meta"></span>

</header>

r is defined as 'no snow falling', which makes them mutually exclusive in the definition but not in the vector. 'forest' flag is a stretch for scattered pines on cliffs; a 'gorge/cliff' feature is not expressible."}}, {"meta": {"id": "mia-9183", "source": "Minneapolis Institute of Art", "group": "famous", "title": "New Year’s Eve Foxfires at the Changing Hackberry Tree in Ōji", "title_alt": "Ōji, shōzoku-enoki, Ōmisoka no kitsunebi", "artist": "Utagawa Hiroshige; Publisher: Sakanaya Eikichi", "date": "1857, 9th month", "series": "One Hundred Famous Views of Edo (Meisho Edo hyakkei 名所江戸百景)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "13 1/4 x 8 11/16 in. (33.6 x 22 cm) (image)\r\n13 7/8 × 8 3/4 in. (35.3 × 22.2 cm) (sheet, vertical ōban)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/009000/100/80/9183/mia_39392a_800.jpg", "object_url": "https://collections.artsmia.org/art/9183", "pixel_size": [1746, 2731]}, "tags": {"id": "mia-9183", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"clear": 1.0}, "wind": 0.0, "time_of_day": {"night": 1.0}, "moon": false, "season": {"winter": 1.0}, "seasonal_markers": ["new_year"], "environment": {"settlement": {"rural": 0.8, "town": 0.2}, "water": {"none": 1.0}, "terrain": {"flat": 1.0}, "flags": ["forest"]}, "place": {"name": "Ōji, Shōzoku enoki (hackberry tree)", "lat": 35.75, "lon": 139.74, "precision_km": 2}, "fuji": false, "crop": [0.02, 0.01, 0.97, 0.98], "crop_note": "sheet on light backdrop; small sheet margins, slight stain at lower left edge", "palette": ["#4a5154", "#e9c9a6", "#2f3a3a"], "confidence": {"weather": 0.8, "time_of_day": 0.95, "season": 0.95, "environment": 0.7}, "evidence": "Title 'New Year's Eve'; dark sky with scattered stars, glowing foxfires, bare tree. Night is certain, winter from title and bare branches.", "taxonomy_friction": "The scene is a supernatural event (foxfires) on one specific night (Ōmisoka, 31 Dec); 'new_year' l IDs in TAXONOMY (used snake_case 'plum_blossom'). Small stream/pond at left: river vs lake ambiguous."}}, {"meta": {"id": "mia-61187", "source": "Minneapolis Institute of Art", "group": "famous", "title": "Irises at Horikiri", "title_alt": "Horikiri no hana-shōbu", "artist": "Utagawa Hiroshige; Publisher: Sakanaya Eikichi", "date": "1857, intercalary 5th month", "series": "One Hundred Famous Views of Edo (Meisho Edo hyakkei 名所江戸百景)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "13 1/4 x 8 11/16 in. (33.6 x 22 cm) (image)\r\n14 1/4 × 9 3/4 in. (36.2 × 24.7 cm) (sheet, vertical ōban)\r\n17 15/16 x 14 in. (45.5 x 35.5 cm) (mat)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/061000/100/80/61187/mia_33300a_800.jpg", "object_url": "https://collections.artsmia.org/art/61187", "pixel_size": [1809, 2731]}, "tags": {"id": "mia-61187", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"clear": 1.0}, "wind": 0.0, "time_of_day": {"day": 0.8, "dawn": 0.1, "dusk": 0.1}, "moon": false, "season": {"summer": 0.8, "spring": 0.2}, "seasonal_markers": ["iris"], "environment": {"settlement": {"rural": 1.0}, "water": {"river": 0.6, "lake": 0.4}, "terrain": {"flat": 1.0}, "flags": ["garden_park"]}, "place": {"name": "Horikiri iris garden, Katsushika, Tokyo", "lat": 35.745, "lon": 139.827, "precision_km": 2}, "fuji": false, "crop": [0.0, 0.0, 1.0, 1.0], "crop_note": "Sheet trimmed close to the image; very thin margin, no backdrop visible.", "palette": ["#4f97a8", "#2e7d4f", "#2a5d9e"], "confidence": {"weather": 0.85, "time_of_day": 0.6, "season": 0.9, "environment": 0.7}, "evidence": "Clear blue sky with pink horizon band (read as convention, not dusk); visitors strolling among irises suggest daytime. Season from irises and title (Horikiri iris garden, published 5th month).", "taxonomy_friction": "Iris garden channels/ponds sit between river and lake. Strong close-up foreground flowers make it half bird-and-flower, half landscape; genre is forced to one value. Pink/red horizon bokashi again not covered by the conventions note."}}, {"meta": {"id": "mia-61182", "source": "Minneapolis Institute of Art", "group": "famous", "title": "Teppōzu and Tsukiji Monzeki Temple", "title_alt": "Teppōzu Tsukiji monzeki, 鉄砲州築地門跡", "artist": "Utagawa Hiroshige; Publisher: Sakanaya Eikichi", "date": "1858, 7th month", "series": "One Hundred Famous Views of Edo (Meisho Edo hyakkei 名所江戸百景), here called One Hundred Views of Edo for Entertainment (Edo hyakkei yokyō 江戸百景余興)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "13 3/8 x 8 13/16 in. (34 x 22.4 cm) (image)\r\n14 1/8 × 9 3/8 in. (35.9 × 23.8 cm) (sheet, vertical ōban)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/061000/100/80/61182/mia_33248a_800.jpg", "object_url": "https://collections.artsmia.org/art/61182", "pixel_size": [1822, 2743]}, "tags": {"id": "mia-61182", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"clear": 0.8, "cloudy": 0.2}, "wind": 0.3, "time_of_day": {"day": 0.5, "dusk": 0.4, "dawn": 0.1}, "moon": false, "season": {"autumn": 0.8, "summer": 0.2}, "seasonal_markers": ["wild_geese"], "environment": {"settlement": {"city": 1.0}, "water": {"sea": 0.7, "river": 0.3}, "terrain": {"flat": 1.0}, "flags": ["temple_shrine"]}, "place": {"name": "Teppōzu, off Tsukiji Hongan-ji (Edo)", "lat": 35.665, "lon": 139.775, "precision_km": 2}, "fuji": false, "crop": [0.0, 0.0, 1.0, 1.0], "crop_note": "scan cropped at the image border; no margin visible", "palette": ["#b7d0d6", "#efe6d6", "#3a3f4a"], "confidence": {"weather": 0.7, "time_of_day": 0.4, "season": 0.6, "environment": 0.9}, "evidence": "Clear pale sky with a red horizon band under dark top bokashi; a skein of geese flying suggests autumn and possibly evening, but the red band may be convention, so time is partly a guess. Series places it in the autumn section.", "taxonomy_friction": "Marker list has 'wild geese (descending)' but here geese are flying in formation, not descending; I used wild_geese anyway. Marker names have no canonical IDs in TAXONOMY.md, so I invented snake_case ids (wild_geese, snow, new_year, summer_fireworks). Sumida river mouth into Edo Bay is between river and sea."}}, {"meta": {"id": "mia-61148", "source": "Minneapolis Institute of Art", "group": "famous", "title": "Seidō and Kanda River from Shōhei Bridge", "title_alt": "Shōhei-bashi seidō Kanda-gawa, The Temple of Confucius Near The Shōhei Bridbe Over the Kanda River", "artist": "Utagawa Hiroshige; Publisher: Sakanaya Eikichi", "date": "1857, 9th month", "series": "One Hundred Famous Views of Edo (Meisho Edo hyakkei 名所江戸百景)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "13 1/4 x 8 3/4 in. (33.7 x 22.3 cm) (image)\r\n14 1/4 × 9 5/8 in. (36.2 × 24.4 cm) (sheet, vertical ōban)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/061000/100/40/61148/mia_33298a_800.jpg", "object_url": "https://collections.artsmia.org/art/61148", "pixel_size": [1802, 2709]}, "tags": {"id": "mia-61148", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"rain": 0.8, "storm": 0.2}, "wind": 0.2, "time_of_day": {"day": 0.5, "dusk": 0.3, "night": 0.2}, "moon": false, "season": {"summer": 0.8, "spring": 0.2}, "seasonal_markers": [], "environment": {"settlement": {"city": 0.7, "town": 0.3}, "water": {"river": 1.0}, "terrain": {"hilly": 1.0}, "flags": ["bridge", "temple_shrine"]}, "place": {"name": "Shōhei Bridge / Yushima Seidō, Kanda River, Edo", "lat": 35.7, "lon": 139.77, "precision_km": 1}, "fuji": false, "crop": [0.0, 0.0, 1.0, 1.0], "crop_note": "scan trimmed to the sheet; no visible border", "palette": ["#141414", "#5ea24e", "#7aa7d2"], "confidence": {"weather": 0.9, "time_of_day": 0.3, "season": 0.6, "environment": 0.8}, "evidence": "Dense slanted rain lines over the whole image, figures with umbrellas on the slope. Black sky is ambiguous (rain darkness vs evening) — time of day is a guess. Lush green bank suggests summer.", "taxonomy_friction": "A solid black sky in a rain scene is a pictorial device for heavy rain and gloom, not necessarily night; the taxonomy only warns about ichimonji-bokashi, not full black skies. Seidō is a Confucian temple; temple_shrine is defined as Buddhist/Shinto, so it is a stretch."}}, {"meta": {"id": "mia-62748", "source": "Minneapolis Institute of Art", "group": "famous", "title": "Reflection in Lake Misaka, Kai Province", "title_alt": "Kōshū Misaka suimen, 甲州三坂水面", "artist": "Katsushika Hokusai; Publisher: Nishimuraya Yohachi", "date": "1830–33", "series": "Thirty-six Views of Mount Fuji (Fuji sanjūrokkei 富嶽三十六景)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "9 15/16 × 14 5/8 in. (25.3 × 37.2 cm) (image, sheet, horizontal ōban)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/062000/700/40/62748/mia_7018214_800.jpg", "object_url": "https://collections.artsmia.org/art/62748", "pixel_size": [6395, 4407]}, "tags": {"id": "mia-62748", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"clear": 1.0}, "wind": 0.0, "time_of_day": {"day": 0.8, "dawn": 0.1, "dusk": 0.1}, "moon": false, "season": {"summer": 0.6, "autumn": 0.2, "spring": 0.2}, "seasonal_markers": [], "environment": {"settlement": {"rural": 0.6, "wild": 0.4}, "water": {"lake": 1.0}, "terrain": {"mountain": 1.0}, "flags": ["forest"]}, "place": {"name": "Lake Kawaguchi from Misaka pass road (Kai Province)", "lat": 35.51, "lon": 138.76, "precision_km": 5}, "fuji": true, "crop": [0.0, 0.0, 1.0, 1.0], "crop_note": "sheet fills frame with uninked paper margin around image; vertical centre fold/join line", "palette": ["#4a7fb5", "#e2dccb", "#2e3a30"], "confidence": {"weather": 0.8, "time_of_day": 0.6, "season": 0.4, "environment": 0.9}, "evidence": "Clear sky with red top band and a faint pink horizon (likely convention). Fuji is shown snowless and trees are green, so summer leaning; the famous winter reflection is faded in this impression. Time mostly a guess.", "taxonomy_friction": "Snowless Fuji is an important season cue that isn't in the marker list (snow-capped vs. bare Fuji). The print plays two seasons at once (summer peak, winter reflection) which a single season vector can only smear. Red ichimonji-bokashi not covered by the convention note."}}, {"meta": {"id": "mia-9149", "source": "Minneapolis Institute of Art", "group": "famous", "title": "Lower Meguro", "title_alt": "Shimo-Meguro, 下目黒", "artist": "Katsushika Hokusai; Publisher: Nishimuraya Yohachi", "date": "1830–33", "series": "Thirty-six Views of Mount Fuji (Fuji sanjūrokkei 富嶽三十六景)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "10 1/16 × 14 3/4 in. (25.5 × 37.5 cm) (image, sheet, horizontal ōban)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/009000/100/40/9149/mia_7018240_800.jpg", "object_url": "https://collections.artsmia.org/art/9149", "pixel_size": [6562, 4431]}, "tags": {"id": "mia-9149", "genre": "figures_in_landscape", "include": true, "exclude_reason": null, "weather": {"clear": 0.8, "mist": 0.2}, "wind": 0.0, "time_of_day": {"day": 1.0}, "moon": false, "season": null, "seasonal_markers": [], "environment": {"settlement": {"rural": 1.0}, "water": {"none": 1.0}, "terrain": {"hilly": 1.0}, "flags": []}, "place": {"name": "Shimo-Meguro, Meguro, Tokyo", "lat": 35.63, "lon": 139.71, "precision_km": 2}, "fuji": true, "crop": [0.025, 0.02, 0.95, 0.955], "crop_note": "Sheet on light grey backdrop; faint vertical fold at centre.", "palette": ["#e8e2cc", "#2d4f8a", "#c9c27a"], "confidence": {"weather": 0.7, "time_of_day": 0.7, "season": null, "environment": 0.9}, "evidence": "Pale even sky, blue haze band behind Fuji (partly convention, a little haze counted), farmers on terraced fields and thatched houses; daylight scene. No seasonal plants; green fields could be any growing season.", "taxonomy_friction": "Blue band at horizon: sea, haze or convention? Counted as slight mist, not water. Season: green fields hint at spring-autumn but too weak to commit, so null."}}, {"meta": {"id": "mia-9612", "source": "Minneapolis Institute of Art", "group": "famous", "title": "Rainstorm beneath the Summit", "title_alt": "Sanka hakuu, 山下白雨, 冨嶽三十六景　山下白雨, Fuji sanjūrokkei Sanka hakuu", "artist": "Katsushika Hokusai; Publisher: Nishimuraya Yohachi", "date": "1830–33", "series": "Thirty-six Views of Mount Fuji (Fuji sanjūrokkei 富嶽三十六景)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "10 × 14 5/8 in. (25.4 × 37.2 cm) (image, sheet, horizontal ōban)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/009000/600/10/9612/mia_7021688_800.jpg", "object_url": "https://collections.artsmia.org/art/9612", "pixel_size": [9278, 6431]}, "tags": {"id": "mia-9612", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"storm": 0.5, "clear": 0.3, "cloudy": 0.2}, "wind": 0.2, "time_of_day": {"day": 1.0}, "moon": false, "season": {"summer": 0.8, "autumn": 0.2}, "seasonal_markers": [], "environment": {"settlement": {"wild": 1.0}, "water": {"none": 1.0}, "terrain": {"mountain": 1.0}, "flags": []}, "place": {"name": "Mount Fuji (summit area; no defined viewpoint)", "lat": 35.36, "lon": 138.73, "precision_km": 20}, "fuji": true, "crop": [0.01, 0.01, 0.985, 0.975], "crop_note": "Sheet on light grey museum backdrop; thin backdrop strip at bottom.", "palette": ["#3a2a22", "#c75a32", "#2d5a8a"], "confidence": {"weather": 0.6, "time_of_day": 0.7, "season": 0.6, "environment": 0.85}, "evidence": "Title 'Rainstorm beneath the summit'; lightning in the dark lower slopes while the summit stands in clear sky with cumulus. Summer from the classic subject (summer thunderstorm, little snow on peak). Daytime from bright sky.", "taxonomy_friction": "Two weather regimes in one image (storm below, clear above): a soft vector mixes them but matching would show this during light cloud too. Lightning shown without rain lines. 'Place' is the mountain itself, not a viewpoint, contradicting the 'viewpoint' rule for proximity."}}, {"meta": {"id": "mia-22514", "source": "Minneapolis Institute of Art", "group": "famous", "title": "In the Mountains of Tōtōmi Province", "title_alt": "Tōtōmi sanchū, 遠江山中", "artist": "Katsushika Hokusai; Publisher: Nishimuraya Yohachi", "date": "1830–33", "series": "Thirty-six Views of Mount Fuji (Fuji sanjūrokkei 富嶽三十六景)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "9 15/16 × 14 5/8 in. (25.3 × 37.1 cm) (image, sheet, horizontal ōban)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/022000/500/10/22514/mia_7018228_800.jpg", "object_url": "https://collections.artsmia.org/art/22514", "pixel_size": [6327, 4305]}, "tags": {"id": "mia-22514", "genre": "figures_in_landscape", "include": true, "exclude_reason": null, "weather": {"clear": 0.6, "cloudy": 0.4}, "wind": 0.1, "time_of_day": {"day": 1.0}, "moon": false, "season": null, "seasonal_markers": [], "environment": {"settlement": {"wild": 0.6, "rural": 0.4}, "water": {"none": 1.0}, "terrain": {"mountain": 0.6, "hilly": 0.4}, "flags": []}, "place": {"name": "Mountains of Tōtōmi Province", "lat": 34.95, "lon": 137.95, "precision_km": 40}, "fuji": true, "crop": [0.0, 0.0, 1.0, 1.0], "crop_note": "sheet fills the frame; vertical join/fold line at centre (two-panel scan or paper join)", "palette": ["#cfd8d6", "#1f3f6e", "#e9e3d2"], "confidence": {"weather": 0.6, "time_of_day": 0.8, "season": 0.1, "environment": 0.7}, "evidence": "Blue sky with large billowing cloud and smoke from a fire; even daylight. Snow-capped Fuji is perennial and the sawyers' clothing gives no clear season.", "taxonomy_friction": "Labour scene (sawyers on a huge timber) dominates the composition; genre is borderline between figures_in_landscape and other. Place is only a province ('Tōtōmi sanchū'), so precision_km is very xpress that. Shin hanga soft hazy sky sits between clear, cloudy and mist."}}, {"meta": {"id": "mia-93459", "source": "Minneapolis Institute of Art", "group": "random_landscape", "title": "Evening Snow at Shinobugaoka", "title_alt": "Shinobugaoka no bosetsu", "artist": "Eisen 英泉; Publisher: Yamamoto Kyūbei", "date": "1843–47", "series": "Eight Views of Edo (Edo hakkei)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "8 3/4 x 13 11/16 in. (22.23 x 34.77 cm) (image)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/093000/400/50/93459/mia_9003470_800.jpg", "object_url": "https://collections.artsmia.org/art/93459", "pixel_size": [12584, 8680]}, "tags": {"id": "mia-93459", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"snow_cover": 0.6, "snowfall": 0.2, "cloudy": 0.2}, "wind": 0.0, "time_of_day": {"dusk": 0.7, "day": 0.3}, "moon": false, "season": {"winter": 1.0}, "seasonal_markers": ["snow"], "environment": {"settlement": {"city": 0.4, "town": 0.6}, "water": {"lake": 1.0}, "terrain": {"hilly": 0.6, "flat": 0.4}, "flags": ["temple_shrine", "garden_park"]}, "place": {"name": "Shinobugaoka (Ueno hill) above Shinobazu Pond, Tokyo", "lat": 35.712, "lon": 139.771, "precision_km": 2}, "fuji": false, "crop": [0.015, 0.015, 0.97, 0.975], "crop_note": "Full sheet with wide paper margins around a bordered image area (~[0.03,0.1,0.9,0.83]); fan-shaped title cartouche.", "palette": ["#e8e4dc", "#5a9fae", "#4a4a52"], "confidence": {"weather": 0.6, "time_of_day": 0.7, "season": 0.95, "environment": 0.8}, "evidence": "Title 'Evening snow' (bosetsu); thick snow on roofs and trees, open umbrellas and figures shovelling; grey sky with dark-red band at horizon. Dusk from title; falling snow implied by umbrellas but no flakes drawn.", "taxonomy_friction": "'Evening snow' (bosetsu) is a stock Eight Views title; snowfall vs snow_cover hinges on umbrellas, since no flakes are drawn. Wide ornamental margins: is 'crop'  nowhere to note unexplained motifs. Distant sea view vs. sea at the location are indistinguishable in the water vector."}}, {"meta": {"id": "mia-81827", "source": "Minneapolis Institute of Art", "group": "random_landscape", "title": "Ryūdō", "title_alt": "Ryūdō", "artist": "Totoya Hokkei", "date": "1833", "series": "Record of a Journey to Enoshima (Enoshima kikō 江島記行)", "genre_hint": "Print (surimono / fūkei-ga)", "dimensions": "8 x 6 7/8 in. (20.3 x 17.5 cm) (image, sheet)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/081000/800/20/81827/mia_46450a_800.jpg", "object_url": "https://collections.artsmia.org/art/81827", "pixel_size": [3862, 4425]}, "tags": {"id": "mia-81827", "genre": "figures_in_landscape", "include": true, "exclude_reason": null, "weather": {"clear": 0.9, "cloudy": 0.1}, "wind": 0.1, "time_of_day": {"day": 1.0}, "moon": false, "season": {"spring": 0.5, "summer": 0.2, "autumn": 0.3}, "seasonal_markers": [], "environment": {"settlement": {"wild": 0.8, "town": 0.2}, "water": {"sea": 1.0}, "terrain": {"hilly": 1.0}, "flags": []}, "place": {"name": "Enoshima, Ryūdō (Iwaya caves)", "lat": 35.3, "lon": 139.47, "precision_km": 1}, "fuji": true, "crop": [0.01, 0.01, 0.98, 0.98], "crop_note": "surimono, near square; sheet fills the scan with a thin backdrop strip; orange border rule is part of the print", "palette": ["#a9c2bf", "#8fa874", "#e7a98c"], "confidence": {"weather": 0.7, "time_of_day": 0.6, "season": 0.3, "environment": 0.8}, "evidence": "Pale sky with stylised horizontal cloud bands (not weather), picnicking party on mats, cave entrance; daylight. Season guessed from picnic outing (spring), no plants or seasonal markers visible.", "taxonomy_friction": "Surimono WITH a full scene: included per brief, but poems cover a third of the sky. A cave/grotto (Iwaya) has no flag; 'rocky coast/cliffs' isn't expressible (terrain hilly + sea is the nearest). Picnic is a weak seasonal cue."}}, {"meta": {"id": "mia-61742", "source": "Minneapolis Institute of Art", "group": "random_landscape", "title": "(Reflection of Moon)", "title_alt": null, "artist": "Utagawa Hiroshige; Publisher: Maruya Seijirō", "date": "1830s", "series": null, "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "8 3/4 x 13 3/4 in. (22.2 x 34.9 cm) (image, sheet)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/061000/700/40/61742/mia_34662a_800.jpg", "object_url": "https://collections.artsmia.org/art/61742", "pixel_size": [2952, 1872]}, "tags": {"id": "mia-61742", "genre": "figures_in_landscape", "include": true, "exclude_reason": null, "weather": {"clear": 1.0}, "wind": 0.0, "time_of_day": {"night": 0.6, "dusk": 0.4}, "moon": true, "season": {"autumn": 1.0}, "seasonal_markers": ["autumn_grasses_moon_viewing"], "environment": {"settlement": {"wild": 0.6, "rural": 0.4}, "water": {"lake": 0.5, "river": 0.5}, "terrain": {"hilly": 1.0}, "flags": []}, "place": null, "fuji": false, "crop": [0.01, 0.01, 0.98, 0.97], "crop_note": "sheet nearly fills frame; small loss top-right corner, slight discoloration", "palette": ["#3a5a7a", "#e8dcc4", "#3f8a5f"], "confidence": {"weather": 0.7, "time_of_day": 0.6, "season": 0.9, "environment": 0.5}, "evidence": "Title '(Reflection of Moon)'; moon shown only as reflection in water, red streak in pale sky = dusk/night. Flowering bush clover (hagi) = autumn grasses / moon viewing.", "taxonomy_friction": "Moon appears only as a reflection; the moon flag doesn't distinguish this. Court figures are large (borderline for 'setting dominates'). Water type unidentifiable (pond or river). Sky is pale/unprinted despite night: night shown by subject not palette."}}, {"meta": {"id": "mia-64198", "source": "Minneapolis Institute of Art", "group": "random_landscape", "title": "The Shrine of Bonfire, Oki Province", "title_alt": "Oki, takibi no yashiro, Famous Places of the Sixty Odd Provinces, Rokuju_-yo-shu_ meisho zue", "artist": "Utagawa Hiroshige; Publisher: Koshimuraya Heisuke", "date": "1856, 12th month", "series": "Famous Places in the Sixty-odd Provinces (Rokujūyoshū meisho zue 六十余州名所図絵)", "genre_hint": "Print (ukiyo-e / fūkei-ga)", "dimensions": "13 1/2 × 9 in. (34.3 × 22.8 cm) (image, vertical ōban)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/064000/100/90/64198/mia_33994a_800.jpg", "object_url": "https://collections.artsmia.org/art/64198", "pixel_size": [1785, 2677]}, "tags": {"id": "mia-64198", "genre": "landscape", "include": true, "exclude_reason": null, "weather": null, "wind": 0.5, "time_of_day": {"dusk": 0.4, "night": 0.6}, "moon": false, "season": null, "seasonal_markers": [], "environment": {"settlement": {"wild": 1.0}, "water": {"sea": 1.0}, "terrain": {"hilly": 1.0}, "flags": ["forest"]}, "place": {"name": "Takuhi Shrine (Takibi no yashiro), Nishinoshima, Oki Islands", "lat": 36.08, "lon": 133.0, "precision_km": 5}, "fuji": false, "crop": [0.01, 0.005, 0.98, 0.99], "crop_note": "Image trimmed to (or near) sheet edge; no backdrop visible.", "palette": ["#2f7273", "#26453f", "#a88270"], "confidence": {"weather": null, "time_of_day": 0.5, "season": null, "environment": 0.8}, "evidence": "Ship's bow in rolling waves below a dark wooded island; no sky shown, so weather null. Overall dark teal palette plus the bonfire-shrine legend (guiding fires seen from ships at night) suggest night; still largely a guess.", "taxonomy_friction": "No sky at all, but rough whitecapped sea gives wind/roughness; schema has no 'sea state'. Shrine named in title is not actually visible, so temple_shrine flag left off; place is the shrine but the viewpoint is offshore. Publication month (12th) is not scene season."}}, {"meta": {"id": "mia-117519", "source": "Minneapolis Institute of Art", "group": "random_landscape", "title": "Teahouse", "title_alt": "Yasumi chashitsu, 休み茶屋, Tea House in Azalea Garden", "artist": "Yoshida Hiroshi (self-published)", "date": "1938", "series": null, "genr _url": "https://img.artsmia.org/web_objects_cache/117000/400/60/117462/mia_7007118_800.jpg", "object_url": "https://collections.artsmia.org/art/117462", "pixel_size": [7321, 4778]}, "tags": {"id": "mia-117462", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"mist": 0.5, "cloudy": 0.3, "clear": 0.2}, "wind": 0.2, "time_of_day": {"day": 0.6, "dusk": 0.2, "dawn": 0.2}, "moon": false, "season": {"summer": 0.8, "autumn": 0.2}, "seasonal_markers": ["lingering_snow"], "environment": {"settlement": {"wild": 1.0}, "water": {"none": 1.0}, "terrain": {"mountain": 1.0}, "flags": []}, "place": {"name": "Tateyama Betsuzan, Northern Japan Alps", "lat": 36.59, "lon": 137.62, "precision_km": 3}, "fuji": false, "crop": [0.02, 0.02, 0.96, 0.95], "crop_note": "wide paper margins with pencil title/signature below image; deckled right edge; museum label strip overlaps lower right corner", "palette": ["#4a4a7e", "#b39e7a", "#e8e2d8"], "confidence": {"weather": 0.7, "time_of_day": 0.4, "season": 0.6, "environment": 0.95}, "evidence": "Clouds and mist rolling over the ridge, sunlit pinkish peaks and cloud tops, large snowfield on the plateau with summer-brown grass. Pink light might be late afternoon or morning — time is a guess.", "taxonomy_friction": "Summer snowfields (sekkei) in the Alps: snow lying on the ground but not winter. snow_cover would mis-signal winter and the snow marker peaks in January, so I added marker 'lingering_snow' (alpine summer). Mist vs. cloud is blurred at altitude (we are inside the clouds)."}}, {"meta": {"id": "mia-117500", "source": "Minneapolis Institute of Art", "group": "random_landscape", "title": "Evening in Nara", "title_alt": "Nara no yūbe, 奈良の夕", "artist": "Yoshida Hiroshi (self-published)", "date": "1933", "series": "Untitled series known as Kansai District", "genre_hint": "Print (shin hanga / fūkei-ga)", "dimensions": "15 7/8 × 10 3/4 in. (40.32 × 27.31 cm) (sheet, vertical ōban)", "rights": "Public Domain", "image_url": _objects_cache/094000/000/00/94001/mia_41094a_800.jpg", "object_url": "https://collections.artsmia.org/art/94001", "pixel_size": [2608, 1658]}, "tags": {"id": "mia-94001", "genre": "figures_in_landscape", "include": true, "exclude_reason": null, "weather": {"cloudy": 0.2, "rain": 0.5, "storm": 0.3}, "wind": 0.9, "time_of_day": {"day": 0.6, "dusk": 0.4}, "moon": false, "season": {"autumn": 0.7, "winter": 0.3}, "seasonal_markers": [], "environment": {"settlement": {"rural": 0.8, "town": 0.2}, "water": {"none": 0.5, "river": 0.5}, "terrain": {"flat": 1.0}, "flags": []}, "place": {"name": "Kutsukake (Kisokaidō station), Naka-Karuizawa", "lat": 36.34, "lon": 138.6, "precision_km": 5}, "fuji": false, "crop": [0.01, 0.01, 0.98, 0.98], "crop_note": "Sheet edge close to frame; rounded corner cut-outs typical of series.", "palette": ["#e8dfc6", "#2d2c2e", "#5fb5b0"], "confidence": {"weather": 0.7, "time_of_day": 0.4, "season": 0.5, "environment": 0.75}, "evidence": "Title 'Rain on the Plain'; dark sky band, leaves stripped and flying, trees bent, travellers and pack horses leaning into the wind. Rain lines barely visible, so storm/rain inferred mostly from wind and title. Pink horizon makes dusk possible; time is a guess. Falling leaves suggest autumn.", "taxonomy_friction": "Wind-dominated storm without drawn rain lines: 'storm' requires rain or waves, and wind is only a modifier, so a gale scene is hard to express. Grey water band at left could be flooded paddies or a river."}}, {"meta": {"id": "mia-82995", "source": "Minneapolis Institute of Art", "group": "random_landscape", "title": "Little Harbor", "title_alt": "Kominato, 小港, Little Harbour", "artist": "Yoshida Hiroshi (self-published)", "date": "1941", "series": null, "genre_hint": "Print (shin hanga / fūkei-ga)", "dimensions": "10 1/16 x 7 11/16 in. (25.6 x 19.6 cm) (sheet)", "rights": "Public Domain", "image_url": "https://img.artsmia.org/web_objects_cache/082000/900/90/82995/mia_7007189_800.jpg", "object_url": "http tion": "snow_cover lives in the weather vector, so 'snow on the ground + overcast' has to be split between two categories; a separate snow-cover modifier would be cleaner. Distant white mountain not identifiable as Fuji."}}, {"meta": {"id": "aic-4421", "source": "Art Institute of Chicago", "group": "famous", "title": "Kyoto: The Great Bridge at Sanjo (Kyo, Sanjo Ohashi zu), from the series \"Fifty-three Stations of the Tokaido (Tokaido gojusan tsugi),\" also known as the Tokaido with Poem (Kyoka iri Tokaido)", "title_alt": null, "artist": "Utagawa Hiroshige 歌川 広重\nJapanese, 1797-1858", "date": "c. 1837/42", "series": null, "genre_hint": "Color woodblock print; chuban", "dimensions": "15.9 × 22.3 cm (6 1/4 × 8 3/4 in.)", "subjects": ["woodblock print", "Japanese (culture or style)", "print", "asian art"], "rights": "CC0", "image_url": "https://www.artic.edu/iiif/2/5750553c-2ea5-a0e9-4413-8949d10a0717/full/843,/0/default.jpg", "object_url": "https://www.artic.edu/artworks/4421", "pixel_size": [3000, 2176]}, "tags": {"id": "aic-4421", "genre": "landscape", "include": true, "exclude_reason": null, "weather": {"clear": 1.0}, "wind": 0.0, "time_of_day": {"day": 0.8, "dawn": 0.1, "dusk": 0.1}, "moon": false, "season": null, "seasonal_markers": [], "environment": {"settlement": {"city": 1.0}, "water": {"river": 1.0}, "terrain": {"flat": 0.7, "hilly": 0.3}, "flags": ["bridge"]}, "place": {"name": "Sanjō Ōhashi bridge, Kyoto (west end looking east)", "lat": 35.009, "lon": 135.772, "precision_km": 1}, "fuji": false, "crop": [0.0, 0.0, 1.0, 1.0], "crop_note": "Sheet trimmed to image; corners clipped showing white.", "palette": ["#2e78b8", "#4a4a3e", "#e8c87a"], "confidence": {"weather": 0.8, "time_of_day": 0.6, "season": 0.1, "environment": 0.85}, "evidence": "Blue sky with pink horizon band and grey gradation at the foot of Higashiyama (convention, not mist); busy bridge traffic suggests daytime. No seasonal cues.", "taxonomy_friction": "Terrain: viewpoint is flat riverbank but the scene is dominated by the Higashiyama mountains; unclear whether terrain describes the viewpoint or the view. Pink horizon again ambiguous."}}, {"meta": {"id": "aic-10929", "source": "Art Institute of Chicago", "group": "famous", "title": "Yoshiwara: Mount Fuji on the Left (Yoshiwara, hidari Fuji), from the series \"Fifty-three Stations of the Tokaido Road (Tokaido gojusan tsugi no uchi),\" also known as the Hoeido Tokaido", "title_alt": null, "artist": "Utagawa Hiroshige 歌川 広重\nJapanese, 1797-1858", "date": "c. 1833/34", "series": null, "genre_hint": "Color woodblock print; oban", "dimensions": "24.1 × 36.5 cm (9 1/2 × 14 3/8 in.)", "subjects": ["woodblock print", "Japanese (culture or style)", "print", "asian art"], "rights": "CC0", "image_url": "https://www.artic.edu/iiif/2/a792033f-3a88-ae7d-bf3c-0ecb32eb7144/full/843,/0/default.jpg", "object_url": "https://www.artic.edu/artworks/10929", "pixel_size": [3594, 2298]}, "tags": {"id": "aic-10929", "genre": "figures_in_landscape", "include": true, "exclude_reason": null, "weather": {"clear": 0.8, "mist": 0.2}, "wind": 0.0, "time_of_day": {"day": 0.6, "dawn": 0.2, "dusk": 0.2}, "moon": false, "season": {"summer": 0.5, "spring": 0.3, "autumn": 0.2}, "seasonal_markers": [], "environment": {"settlement": {"rural": 1.0}, "water": {"none": 0.6, "lake": 0.4}, "terrain": {"flat": 1.0}, "flags": ["forest"]}, "place": {"name": "Yoshiwara, 'Hidari Fuji' (Tōkaidō)", "lat": 35.16, "lon": 138.68, "precision_km": 3}, "fuji": true, "crop": [0.0, 0.0, 1.0, 1.0], "crop_note": "scan cropped at/near the sheet edge; notched-corner printed border", "palette": ["#e9dfbe", "#8fb7b0", "#4f3a2c"], "confidence": {"weather": 0.7, "time_of_day": 0.4, "season": 0.3, "environment": 0.8}, "evidence": "Pale yellow horizon glow under blue top bokashi, Fuji at left through a pine avenue across wet paddies; soft haze on distant trees. Yellow glow gives no clear dawn/dusk cue, so split; season only from green paddy grass.", "taxonomy_friction": "F const KEY = "ukiyoe-pilot-review-v1";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function vec(v, reason) {
  if (v == null) return `<span class="null">no tag (neutral)${reason ? " — " + esc(reason) : ""}</span>`;
  const entries = Object.entries(v).filter(([, x]) => x > 0).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<span class="null">empty</span>';
  return '<div class="vec">' + entries.map(([k, x]) =>
    `<div class="bar"><span>${esc(k)}</span><i><b style="width:${Math.round(x*100)}%"></b></i><span>${x.toFixed(1)}</span></div>`).join("") + "</div>";
}
function env(e, reason) {
  if (e == null) return `<span class="null">no tag (neutral)${reason ? " — " + esc(reason) : ""}</span>`;
  return `<div class="vec">
    <div><em>settlement</em>${vec(e.settlement)}</div>
    <div><em>water</em>${vec(e.water)}</div>
    <div><em>terrain</em>${vec(e.terrain)}</div>
    <div>${(e.flags||[]).map(f => `<span class="tag">${esc(f)}</span>`).join("") || '<span class="null">no flags</span>'}</div></div>`;
}
function card(d) {
  const m = d.meta, t = d.tags, n = notes[m.id] || {};
  const c = t.crop || [0,0,1,1];
  const conf = t.confidence ? Object.entries(t.confidence).map(([k,v]) => `${k} ${(+v).toFixed(1)}`).join(" · ") : "";
  const place = t.place ? `${esc(t.place.name)} (${t.place.lat}, ${t.place.lon}, ±${t.place.precision_km} km)` : '<span class="null">none</span>';
  const fr = t.taxonomy_friction && !/^\s*(nothing|none)\.?\s*$/i.test(t.taxonomy_friction) ? t.taxonomy_friction : "";
  return `<article class="card ${t.include ? "" : "excluded"} ${n.flag ? "flagged" : ""}" data-id="${esc(m.id)}">
    <div class="imgwrap"><img loading="lazy" src="images/${esc(m.id)}.jpg" alt="${esc(m.title)}">
      <div class="crop" style="left:${c[0]*100}%;top:${c[1]*100}%;width:${c[2]*100}%;height:${c[3]*100}%"></div></div>
    <div class="body">
      <div class="title">${esc(m.title)}</div>
      <div class="meta">${esc(m.artist || "")}${m.series ? " — " + esc(m.series) : ""}<br>
        ${esc(m.source)} · <a href="${esc(m.object_url)}" target="_blank" rel="noopener">object page</a> · ${esc(m.id)} · group: ${esc(m.group)}</div>
      <div class="row"><span>genre</span><span>${esc(t.genre)} ${t.include ? "" : `— <strong>excluded</strong>: ${esc(t.exclude_reason)}`}</span></div>
      <div class="row"><span>era / edition</span><span>${esc(t.era ?? "–")} · ${esc(t.edition ?? "–")}${t.fragment && t.fragment !== "none" ? " · " + esc(t.fragment) : ""}${t.fading ? " · faded" : ""}</span></div>
      <div class="row"><span>weather</span>${vec(t.weather, t.weather_null_reason)}</div>
      <div class="row"><span>wind</span><span>${t.wind ?? '<span class="null">–</span>'}${"snow_ground" in t ? " · snow on ground " + (t.snow_ground ?? "–") : ""}</span></div>
      <div class="row"><span>time of day</span><div>${vec(t.time_of_day, t.time_null_reason)}${t.time_source ? `<span class="meta">from: ${esc(t.time_source)}</span>` : ""}</div></div>
      <div class="row"><span>moon</span><span>${t.moon ? "yes" : "no"}</span></div>
      <div class="row"><span>season</span>${vec(t.season, t.season_null_reason)}</div>
      <div class="row"><span>markers</span><span>${(t.seasonal_markers||[]).map(x => `<span class="tag">${esc(x)}</span>`).join("") || '<span class="null">none</span>'}</span></div>
      <div class="row"><span>environment</span>${env(t.environment, t.environment_null_reason)}</div>
      <div class="row"><span>place</span><span>${place}${t.fuji ? ' <span class="tag">Fuji</span>' : ""}</span></div>
      <div class="row"><span>palette</span><span class="pal">${(t.palette||[]).map(h => `<span style="background:${esc(h)}" title="${esc(h)}"></span>`).join("")}</span></div>
      <div class="row"><span>crop</span><span>${esc(t.crop_note || "")}</span></div>
      <div class="row"><span>confidence</span><span>${esc(conf)}</span></div>
      <div class="evidence">${esc(t.evidence || "")}</div>
      ${fr ? `<div class="friction">Friction: ${esc(fr)}</div>` : ""}
      <div class="review">
        <label><input type="checkbox" class="flag" ${n.flag ? "checked" : ""}> Disagree</label>
        <textarea class="note" placeholder="What's wrong? (e.g. 'this is dusk, not dawn')">${esc(n.note || "")}</textarea>
      </div>
    </div></article>`;
}
function render() {
  const f = document.getElementById("filter").value;
  const shown = DATA.filter(d => {
    const t = d.tags, m = d.meta;
    if (f === "included") return t.include;
    if (f === "excluded") return !t.include;
    if (f === "flagged") return (notes[m.id] || {}).flag;
    if (f === "friction") return t.taxonomy_friction && !/^\s*(nothing|none)\.?\s*$/i.test(t.taxonomy_friction);
    if (["famous", "random_landscape", "kacho_e"].includes(f)) return m.group === f;
    return true;
  });
  document.getElementById("grid").innerHTML = shown.map(card).join("");
  document.getElementById("count").textContent = `${shown.length} of ${DATA.length} prints`;
}
document.getElementById("filter").addEventListener("change", render);
document.getElementById("grid").addEventListener("input", e => {
  const art = e.target.closest(".card"); if (!art) return;
  const id = art.dataset.id; notes[id] = notes[id] || {};
  if (e.target.classList.contains("flag")) { notes[id].flag = e.target.checked; art.classList.toggle("flagged", e.target.checked); }
  if (e.target.classList.contains("note")) notes[id].note = e.target.value;
  save();
});
document.getElementById("export").addEventListener("click", () => {
  const out = document.getElementById("export-out");
  const kept = Object.fromEntries(Object.entries(notes).filter(([, v]) => v.flag || (v.note || "").trim()));
  out.style.display = "block"; out.value = JSON.stringify(kept, null, 1); out.select();
  try { document.execCommand("copy"); } catch (e) {}
});
render();
</script>
</body>
</html>
